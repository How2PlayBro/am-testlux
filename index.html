<script>window.AM_VER='v25.6';</script><script>
/* ===== AM Test Lux — web platform (Supabase) =====
   The app talks to one small API (Data API v1, see web/API.md):
     db.doc(path).get/set/update/delete/onSnapshot · db.collection(path).get/onSnapshot/doc
     user.id/isOwner/can/canEdit/me/profiles/search · downloads.save
   Inside claude.ai that API is window.claude. Here the same API is built on Supabase, so the app code is identical in both builds.
   Access rules are enforced by the database (web/schema.sql), not by this file. */
(() => {
const CFG = window.AM_CFG || {}, VER = window.AM_VER || '';
const HASH0 = location.hash || '';                                   // read before supabase-js clears it
const BLOB = /\/(img|bg_[a-z0-9]+|ph|cert|logo)$/;                   // picture collections → table "blobs" (not pushed live)
const colOf = p => p.replace(/\/[^/]+$/, ''), tbl = p => BLOB.test(colOf(p)) ? 'blobs' : 'docs';
const clone = d => d==null ? d : JSON.parse(JSON.stringify(d));
const snapDoc = (path, data) => ({exists: data!=null, id: path.split('/').pop(), ref: {path}, data: () => data==null ? undefined : clone(data)});
const fail = (e, what) => { const x = new Error((what ? what+': ' : '')+(e && e.message || String(e))); x.code = e && e.code; return x; };
const isUuid = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s));
let sb = null, me = null, prof = null, live = null;

/* ---------- db ---------- */
const cols = new Map();   // collection path → {rows: Map(path → data), cbs: Set, ready: Promise}
const docs = new Map();   // doc path → {data, cbs: Set, ready: Promise}
const emitCol = c => { const list = [...c.rows.keys()].sort().map(p => snapDoc(p, c.rows.get(p))); c.cbs.forEach(cb => { try{ cb({docs: list, size: list.length, empty: !list.length}); }catch(e){ console.error(e); } }); };
const emitDoc = (p, d) => d.cbs.forEach(cb => { try{ cb(snapDoc(p, d.data)); }catch(e){ console.error(e); } });
let emitT = new Set(), emitQ = null;
const later = k => { emitT.add(k); if(!emitQ) emitQ = setTimeout(() => { const ks = [...emitT]; emitT = new Set(); emitQ = null;
  ks.forEach(k => { if(k[0]==='c'){ const c = cols.get(k.slice(1)); if(c) emitCol(c); } else { const d = docs.get(k.slice(1)); if(d) emitDoc(k.slice(1), d); } }); }, 30); };
/* apply a change seen locally (after a successful write) or from the live channel */
function applyChange(path, data){
  const c = cols.get(colOf(path)); if(c){ if(data==null) c.rows.delete(path); else c.rows.set(path, data); later('c'+colOf(path)); }
  const d = docs.get(path); if(d){ d.data = data==null ? null : data; later('d'+path); }
}
async function fetchCol(col){
  const out = new Map(); const N = 1000;
  for(let from = 0; ; from += N){
    const {data, error} = await sb.from(BLOB.test(col) ? 'blobs' : 'docs').select('path,data').eq('col', col).order('path').range(from, from+N-1);
    if(error) throw fail(error, 'อ่านข้อมูลไม่สำเร็จ'); data.forEach(r => out.set(r.path, r.data)); if(data.length < N) break;
  }
  return out;
}
async function fetchDoc(path){
  const {data, error} = await sb.from(tbl(path)).select('data').eq('path', path).maybeSingle();
  if(error) throw fail(error, 'อ่านข้อมูลไม่สำเร็จ'); return data ? data.data : null;
}
function docRef(path){
  return { id: path.split('/').pop(), path,
    get: async () => snapDoc(path, await fetchDoc(path)),
    set: async d => { const v = clone(d)||{}; const {error} = await sb.from(tbl(path)).upsert({path, data:v}); if(error) throw fail(error, 'บันทึกไม่สำเร็จ'); applyChange(path, v); },
    update: async d => { const cur = await fetchDoc(path) || {}; const v = Object.assign(cur, clone(d)); const {error} = await sb.from(tbl(path)).upsert({path, data:v}); if(error) throw fail(error, 'บันทึกไม่สำเร็จ'); applyChange(path, v); },
    delete: async () => { const {error} = await sb.from(tbl(path)).delete().eq('path', path); if(error) throw fail(error, 'ลบไม่สำเร็จ'); applyChange(path, null); },
    onSnapshot: (cb, onErr) => {
      let d = docs.get(path); if(!d){ d = {data:null, cbs:new Set()}; docs.set(path, d); d.ready = fetchDoc(path).then(v => { d.data = v; }); }
      d.cbs.add(cb); d.ready.then(() => cb(snapDoc(path, d.data)), e => { docs.delete(path); if(onErr) onErr(e); });
      return () => d.cbs.delete(cb);
    } };
}
function colRef(col){
  return { path: col, id: col.split('/').pop(),
    doc: id => docRef(col+'/'+(id || (Date.now().toString(36)+Math.random().toString(36).slice(2, 8)))),
    get: async () => { const m = await fetchCol(col); const list = [...m.keys()].map(p => snapDoc(p, m.get(p))); return {docs:list, size:list.length, empty:!list.length}; },
    onSnapshot: (cb, onErr) => {
      let c = cols.get(col); if(!c){ c = {rows:new Map(), cbs:new Set()}; cols.set(col, c); c.ready = fetchCol(col).then(m => { c.rows = m; }); }
      c.cbs.add(cb); c.ready.then(() => { const list = [...c.rows.keys()].sort().map(p => snapDoc(p, c.rows.get(p))); cb({docs:list, size:list.length, empty:!list.length}); }, e => { cols.delete(col); if(onErr) onErr(e); });
      return () => c.cbs.delete(cb);
    } };
}
const db = {doc: docRef, collection: colRef};

/* live channel: one subscription to the small-document table; after a reconnect everything watched is re-read */
function startLive(){
  let first = true;
  live = sb.channel('am-docs').on('postgres_changes', {event:'*', schema:'public', table:'docs'}, ev => {
    const row = ev.new && ev.new.path ? ev.new : null, old = ev.old || {};
    if(ev.eventType==='DELETE'){ if(old.path) applyChange(old.path, null); }
    else if(row) applyChange(row.path, row.data);
  }).subscribe(status => {
    if(status==='SUBSCRIBED'){ if(!first) resync(); first = false; setNet(true); }
    else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED') setNet(false);
  });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') resync(); });
}
async function resync(){
  for(const [col, c] of cols){ try{ c.rows = await fetchCol(col); later('c'+col); }catch(e){} }
  for(const [p, d] of docs){ try{ d.data = await fetchDoc(p); later('d'+p); }catch(e){} }
}
let netOk = true; function setNet(ok){ netOk = ok; const el = document.getElementById('am-net'); if(el) el.hidden = ok; }

/* ---------- user ---------- */
const P = r => ({id:r.id, name:r.name||'', email:r.email||null, avatarUrl:'', color:'#8A6A3B', isMe:r.id===me, guest:false});
const user = {
  id: async () => me, isOwner: async () => !!(prof && prof.is_owner),
  can: async n => n==='data.write' ? true : null,          // the database decides what each person may write
  canEdit: async () => true,
  me: async () => P(prof || {id:me}),
  profiles: async ids => { const want = [...new Set([].concat(ids||[]))].filter(isUuid), out = {}; if(!want.length) return out;
    const {data} = await sb.from('profiles').select('id,name,email').in('id', want); (data||[]).forEach(r => { out[r.id] = P(r); }); return out; },
  search: async q => { const {data, error} = await sb.rpc('am_search', {q: String(q||'').trim()}); if(error) return []; return (data||[]).map(P); },
};

/* ---------- downloads: a normal browser download ---------- */
const downloads = { save: async ({filename, data}) => {
  const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename || 'download'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  return {status:'saved'}; } };

function loginScreen(msg0){

/* ---------- stats ---------- */
/* standard of a room: its own value, else the project-wide value (projects/{pid}.stdAll) */
const stdOf = r => num(r && r.std)!=null ? num(r.std) : num((P_(S.route.pid)||{}).stdAll);
const ST = {ok:['ถึงมาตรฐาน','ok'], low:['ต่ำกว่ามาตรฐาน','low'], nostd:['ยังไม่ใส่มาตรฐาน','warn'], part:['ยังวัดไม่ครบ',''], nopts:['ยังไม่มีจุดวัด',''], na:['ไม่วัด','']};
function rStats(r){
  const all = r.pts||[], P = all.filter(p => !p.na), vals = P.map(p => num(p.v)).filter(v => v!=null), std = stdOf(r);
  const avg = vals.length ? vals.reduce((s, v) => s+v, 0)/vals.length : null, mn = vals.length ? Math.min(...vals) : null, mx = vals.length ? Math.max(...vals) : null, done = !!P.length && vals.length===P.length;
  return {n:all.length, na:all.length-P.length, m:vals.length, avg, mn, mx, u0:avg ? mn/avg : null, std, done, st:r.na ? 'na' : !all.length ? 'nopts' : !done ? 'part' : std==null ? 'nostd' : avg>=std ? 'ok' : 'low'};
}
function pStats(pid){
  const rooms = roomsOf(pid), o = {rooms, noPts:[], noStd:[], part:[], pts:0, meas:0, open:0, ok:0, low:0, done:0, live:0, au:0, mv:0, man:0, del:0, base:{}};
  let n = 0;
  rooms.forEach((r, i) => {
    o.base[r.id] = n; n += (r.pts||[]).length; if(r.na) return; o.live++;
    const s = rStats(r), tag = (i+1)+'. '+(r.n||'');
    if(!s.n) o.noPts.push(tag); if(s.std==null) o.noStd.push(tag); if(s.n && !s.done) o.part.push(tag+' ('+(s.n-s.na-s.m)+' จุด)');
    o.pts += s.n-s.na; o.meas += s.m; if(s.st==='ok') o.ok++; if(s.st==='low') o.low++; if(s.done) o.done++;
    const au = (r.pts||[]).filter(p => p.au).length; o.au += au; o.mv += (r.pts||[]).filter(p => p.au && p.mv).length; o.man += s.n-au; o.del += Math.max(0, (r.autoN||0)-au);
  });
  o.todo = [o.noPts.length ? 'จุดวัด '+o.noPts.length+' ห้อง' : '', o.noStd.length ? 'มาตรฐาน '+o.noStd.length+' ห้อง' : '', o.pts-o.meas>0 ? 'ค่าที่วัด '+(o.pts-o.meas)+' จุด' : ''].filter(Boolean);
  return o;
}

  const P = P_(pid), b = bgOf(P, k); if(!b) return; const bgs = Object.assign({}, P.bgs); delete bgs[k]; putProject(pid, {bgs}); flushAll();

/* ---------- meter photos per point + AI reading of the display ----------
   photo: projects/{pid}/ph/{id} {d (JPEG dataURL ≤ 190k chars), w, h, at, by, room}
   point: p.ph = photo id, p.phb = bytes, p.pt = time taken, p.ai = {v, c (high|medium|low), s (as shown), n (note), at}  */
S.ph = {}; S.aiBusy = {}; S.aiErr = {}; S.smp = null; S.smpImg = null;
const PH_MAX = 190000;
async function photoCompress(file){
  const url = URL.createObjectURL(file), im = new Image(); im.src = url;
  try{ await im.decode(); }catch(e){ URL.revokeObjectURL(url); throw new Error('เปิดรูปนี้ไม่ได้ — ใช้ไฟล์ JPG / PNG'); }
  let dim = 1280, q = .78, cv, d;
  for(let n=0; n<14; n++){
    const k = Math.min(1, dim/Math.max(im.naturalWidth, im.naturalHeight)); cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth*k); cv.height = Math.round(im.naturalHeight*k);
    const c = cv.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height); c.drawImage(im, 0, 0, cv.width, cv.height); d = cv.toDataURL('image/jpeg', q);
    if(d.length <= PH_MAX) break; if(q > .5) q -= .08; else { dim = Math.round(dim*.82); q = .7; }
  }
  URL.revokeObjectURL(url);
  const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', q));
  return {d, w:cv.width, h:cv.height, blob, bytes:Math.round(d.length*.75)};
}
const phLoad = (pid, id) => { const k = pid+'/'+id; if(!S.ph[k]) S.ph[k] = S.db.doc('projects/'+pid+'/ph/'+id).get().then(s => s.exists ? s.data().d : null); S.ph[k].catch(() => { delete S.ph[k]; }); return S.ph[k]; };
function phDel(pid, id){ if(!id) return; delete S.ph[pid+'/'+id]; S.db.doc('projects/'+pid+'/ph/'+id).delete().catch(() => {}); }
/* attach a photo to point i of a room; the old photo of that point is removed */
async function phAttach(pid, rid, i, file){
  const R = S.rooms[pid][rid], p0 = (R.pts||[])[i]; if(!p0) return null;
  const X = await photoCompress(file), id = 'f'+uid();
  await S.db.doc('projects/'+pid+'/ph/'+id).set({d:X.d, w:X.w, h:X.h, at:nowIso(), by:S.me, room:rid});
  S.ph[pid+'/'+id] = Promise.resolve(X.d);
  const L = cl(S.rooms[pid][rid].pts), j = i; const old = L[j].ph;
  Object.assign(L[j], {ph:id, phb:X.bytes, pt:nowIso()}); delete L[j].ai; putRoom(pid, rid, {pts:L}); flushAll();
  if(old) phDel(pid, old);
  return {id, blob:X.blob};
}
function phRemove(pid, rid, i){
  const L = cl(S.rooms[pid][rid].pts||[]), p = L[i]; if(!p || !p.ph) return; const id = p.ph;

const AI_CONF = {high:'มั่นใจสูง', medium:'มั่นใจปานกลาง', low:'ไม่แน่ใจ'};
function aiPrompt(P){
  const meter = meterText(P.info) ? ' The meter is "'+meterText(P.info)+'".' : '';
  return 'The image is a photo of the display of a handheld digital light meter (lux meter) taken on a building site during a lighting test.'+meter+'\n'
    +'Read the main numeric reading on the LCD exactly as shown, including any decimal point. Look for range or multiplier indicators (for example "x10", "x100", "x1000", "k", "klux") and the unit (lux / Lux / LX / fc).\n'
    +'Return JSON only, no other text, in this shape:\n{"shown": string or null (digits exactly as on the display), "multiplier": number (1 if none), "unit": string or null, "value": number or null (the reading in lux = shown x multiplier; if the unit is fc multiply by 10.764), "confidence": "high" | "medium" | "low", "note": string}\n'
    +'confidence is "high" only when every digit and the decimal point are sharp and unambiguous. If no meter display is visible, the digits cannot be read, or the display shows OL / overload, set value to null. '

/* read in the background: quick model first, a stronger one only when the first is unsure; the value is filled only into an empty point */
async function aiRead(pid, rid, phId, blob, zm){
  if(!aiReady() || S.aiBusy[phId]) return; S.aiBusy[phId] = true; delete S.aiErr[phId]; S.onAi && S.onAi(rid, phId);
  const P = P_(pid), ask = tier => S.smp.json(aiPrompt(P)+(zm ? '\nThis image is a zoomed-in crop that the user made of the meter display, so the digits fill most of the frame.' : ''), {images:[blob], modelTier:tier});
  let res = null;
  try{
    res = await ask(zm ? 'default' : 'quick');
    if(!res || num(res.value)==null || res.confidence!=='high'){ try{ const r2 = await ask(zm ? 'complex' : 'default'); if(r2 && (num(r2.value)!=null || num(res && res.value)==null)) res = r2; }catch(e){ if(!res) throw e; } }
  }catch(e){
    const code = e && e.code;
    if(code==='not_granted' || code==='sampling_disabled' || code==='images_unavailable'){ S.smpImg = null; toast('AI อ่านค่าใช้ไม่ได้ในบัญชีนี้ — พิมพ์ค่าเอง', true); }
    S.aiErr[phId] = code==='rate_limited' ? 'ใช้ AI ถี่เกินไปหรือโควตาเต็ม — ลองใหม่ภายหลัง หรือพิมพ์เอง' : code==='invalid_json' ? 'AI ตอบไม่เป็นรูปแบบ — กด "อ่านใหม่" หรือพิมพ์เอง' : code==='cancelled' ? 'ยกเลิกแล้ว' : 'AI อ่านไม่สำเร็จ ('+(code||'error')+')';
  }
  delete S.aiBusy[phId];
  if(res){
    const L = cl((S.rooms[pid][rid]||{}).pts||[]), j = L.findIndex(q => q.ph===phId);
    if(j>=0){ const v = num(res.value), conf = AI_CONF[res.confidence] ? res.confidence : 'low';
      L[j].ai = {v:v==null ? null : Math.round(v*100)/100, c:conf, s:res.shown==null ? '' : String(res.shown).slice(0, 20), n:String(res.note||'').slice(0, 80), at:nowIso()}; if(zm){ L[j].ai.z = 1; if(zm.area) L[j].ai.area = zm.area; if(zm.rot) L[j].ai.rot = zm.rot; }
      if(v!=null && num(L[j].v)==null && !L[j].na) L[j].v = String(L[j].ai.v);
      if(v==null) S.aiErr[phId] = 'AI อ่านค่าไม่ได้'+(res.note ? ': '+res.note : '')+' — พิมพ์เอง';
      putRoom(pid, rid, {pts:L}); }
  }
  S.onAi && S.onAi(rid, phId);
}

/* ---------- calibration certificate of the meter: one file (PDF or picture) per project ----------
   P.info.cert = {n, name, type, size, v, at}   pieces in projects/{pid}/cert/c{k} {d: dataURL slice} */
const CERT_MAX = 6*1024*1024;
const readURL = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(f); });
async function certSave(pid, file){
  noBorrowed(pid);
  if(file.size > CERT_MAX) throw new Error('ไฟล์ใหญ่เกิน 6 MB — สแกนใหม่ให้เล็กลง หรือถ่ายรูปหน้าใบ Cal แทน');
  if(!/pdf$|^image\//i.test(file.type) && !/\.pdf$/i.test(file.name)) throw new Error('ใช้ไฟล์ PDF หรือรูปภาพ');
  let d = await readURL(file), type = file.type || (/\.pdf$/i.test(file.name) ? 'application/pdf' : 'image/jpeg');
  if(/^image\//.test(type) && d.length > 1500000){ const X = await photoCompress(file); d = X.d; type = 'image/jpeg'; }   /* big photos: shrink */
  let pages = 1; if(/pdf$/i.test(type)){ try{ pages = (await pdfOpen(urlBytes(d))).numPages || 1; }catch(e){ pages = 1; } }   /* every page goes into the report (up to 4) */
  const CH = 200000, n = Math.ceil(d.length/CH), old = ((P_(pid).info||{}).cert)||null;
  for(let i=0; i<n; i++) await S.db.doc('projects/'+pid+'/cert/c'+i).set({d:d.slice(i*CH, (i+1)*CH)});
  if(old) for(let i=n; i<old.n; i++) S.db.doc('projects/'+pid+'/cert/c'+i).delete().catch(() => {});
  const v = Date.now(); S.img['cert/'+pid+'/'+v] = Promise.resolve(d);
  putProject(pid, {info:Object.assign({}, P_(pid).info, {cert:{n, name:file.name, type, pages, size:Math.round(d.length*.75), v, at:nowIso()}})}); flushAll();
}

/* ---------- Backup / import projects (อ่ำ 24 ต.ค.) ----------
   One .zip holds one or more projects, exactly as stored (Data API v1 paths), so the same file works in the claude.ai app and on the web:
     manifest.json                       {kind:'am-testlux-backup', v:1, ver, at, by, from, projects:[{pid, name, code, rooms, photos, files, bytes}]}
     p/{pid}/project.json                the project document
     p/{pid}/{collection}/{id}.json      rooms, layout pieces (img), plan backgrounds (bg_*), photos (ph), cal certificate (cert), logos (logo)
   Import always writes a new copy unless the Admin chooses to replace the same project (restore). */
const BK_KIND = 'am-testlux-backup';
const bkCols = P => ['rooms', 'img', 'ph', 'cert', 'logo'].concat(Object.keys((P && P.bgs) || {}).map(k => 'bg_'+k));

/* read a zip made by rtZip (or any plain zip: stored / deflate) */
async function rtUnzip(buf){
  const a = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let e = -1;
  for(let i = a.length-22; i >= Math.max(0, a.length-22-65535); i--) if(rtU32(a, i)===0x06054b50){ e = i; break; }
  if(e < 0) throw new Error('ไม่ใช่ไฟล์ .zip หรือไฟล์เสีย');
  const n = rtU16(a, e+10), out = new Map(), dec = new TextDecoder(); let p = rtU32(a, e+16);
  for(let k=0; k<n; k++){
    if(rtU32(a, p)!==0x02014b50) throw new Error('โครงสร้างไฟล์ .zip ผิด');
    const meth = rtU16(a, p+10), cs = rtU32(a, p+20), nl = rtU16(a, p+28), xl = rtU16(a, p+30), cl2 = rtU16(a, p+32), ho = rtU32(a, p+42);
    const name = dec.decode(a.subarray(p+46, p+46+nl)); p += 46+nl+xl+cl2;
    if(name.endsWith('/')) continue;
    const d0 = ho+30+rtU16(a, ho+26)+rtU16(a, ho+28), raw = a.subarray(d0, d0+cs);
    out.set(name, meth===0 ? raw : meth===8 ? await rtInflate(raw) : (() => { throw new Error('รูปแบบบีบอัดไม่รองรับ: '+meth); })());
  }

}
const bkMB = b => (b/1048576).toFixed(b < 10485760 ? 1 : 0)+' MB';

/* collect every document of one project; a sample project's borrowed drawings are copied in as its own */
async function bkCollect(pid, prog){
  flushAll();
  const P = cl(P_(pid)||{}); delete P.id; const src = srcOf(pid), files = {}, enc = new TextEncoder(); let bytes = 0, photos = 0, rooms = 0;
  const put = (path, data) => { const b = enc.encode(JSON.stringify(data)); files['p/'+pid+'/'+path+'.json'] = b; bytes += b.length; };
  if(P.imgFrom){ P.copiedFrom = P.imgFrom; delete P.imgFrom; }
  for(const col of bkCols(P)){
    const from = col==='rooms' || col==='ph' ? pid : src;
    prog && prog('อ่าน '+(P.name||pid)+' · '+col+'…');
    const s = await S.db.collection('projects/'+from+'/'+col).get();
    s.docs.forEach(d => { const x = d.data(); if(x==null) return; put(col+'/'+d.id, x); if(col==='ph') photos++; if(col==='rooms' && !x.deleted) rooms++; });
  }
  put('project', P);
  return {files, meta:{pid, name:P.name||'', code:P.code||'', rooms, photos, files:Object.keys(files).length, bytes}};
}

async function boot(){
  render();

  try{ S.db = await c.use('db'); }catch(e){ S.db = null; }

  await sampleInit(c);
  window.addEventListener('paste', e => { if(S.onPaste) S.onPaste(e); });
  if(!S.db){ S.pLoaded = true; render(); return; }
  let can = null; try{ can = S.user ? await S.user.can('data.write') : null; }catch(e){ can = null; }
  if(can==null){ try{ can = S.user ? await S.user.canEdit() : false; }catch(e){ can = false; } }
  S.platW = !!can;
  try{ S.isOwner = S.user ? !!(await S.user.isOwner()) : false; }catch(e){ S.isOwner = false; }
  try{ S.me = S.user ? (await S.user.id()) || '' : ''; }catch(e){ S.me = ''; }
  roleCalc(); subAccess(); subProjects(); render();
  if(S.me && S.platW) S.db.doc('seen/'+S.me).set({at:nowIso()}).catch(() => {});   /* lets the Admin pick this person in "สิทธิ์" */
}
